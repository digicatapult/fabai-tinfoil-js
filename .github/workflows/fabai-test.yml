# FabAI's CI for this fork. Upstream's "Run tests" and "Release" workflows
# are disabled in the repository's settings, because their integration
# steps need Tinfoil's API key and their release publishes to Tinfoil's npm
# packages. This runs everything else they run, unchanged, plus the check
# that only FabAI's patches differ from the pinned upstream tag.
name: FabAI CI

on:
  push:
    branches: ["fabai/**"]
  pull_request:

permissions: {}

jobs:
  scope:
    name: Diff from the pinned upstream tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only FabAI's patches differ from upstream
        run: scripts/check-fabai-diff.sh --upstream

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Public and read-only, at the commit upstream's own workflow pins.
      - name: Check out the conformance suite
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tinfoilsh/tinfoil-conformance
          ref: ad1925002c4b04df7f8e7e8cd095559b8e5b5467 # tinfoilsh/tinfoil-conformance#35
          path: tinfoil-conformance
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check ES2020 compatibility
        run: npm run check:es2020

      - name: Check types
        run: npm run check:types

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          TINFOIL_CONFORMANCE_FIXTURES: ${{ github.workspace }}/tinfoil-conformance/vectors/v3

  test-browser:
    name: Test (Browser)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser

  test-bun:
    name: Test (Bun)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Bun unit tests
        run: npm run test:bun -w tinfoil
